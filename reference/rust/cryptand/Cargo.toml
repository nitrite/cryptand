[package]
name = "cryptand"
version = "1.0.0"
edition = "2021"
# The files in `benches/` are plain binaries, not libtest benchmarks.
autobenches = false
description = "Reference implementation of the Cryptand File Format (CFF) v1.0"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake2 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "cryptand"
path = "src/bin/cryptand.rs"

[[bin]]
name = "p1_height"
path = "benches/p1_height.rs"

[[bin]]
name = "p3_engine_write_scale"
path = "benches/p3_write_scale.rs"

[[bin]]
name = "p8_aged_scan"
path = "benches/p8_aged_scan.rs"

[[bin]]
name = "p10_read_tail"
path = "benches/p10_read_tail.rs"

[[bin]]
name = "p11_encryption"
path = "benches/p11_encryption.rs"

[[bin]]
name = "filter_fpr"
path = "benches/filter_fpr.rs"

[[bin]]
name = "interop"
path = "src/bin/interop.rs"
