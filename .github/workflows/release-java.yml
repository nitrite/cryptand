name: Release Java

# Tag `java-vX.Y.Z`. Publishes org.dizitart:cryptand through the Central
# Portal, under the org.dizitart namespace nitrite-java already publishes to.
#
# Secrets: MAVEN_USERNAME / MAVEN_PASSWORD (a Central Portal user token),
# GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE.
#
# Push release tags three at a time at most: GitHub creates no tag events at
# all for a push carrying more than three.

on:
  push:
    tags:
      - 'java-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reference/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Version
        id: v
        run: |
          set -euo pipefail
          version="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "java-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pom version $version"
            exit 1
          fi
          # Resumable: a version already on Central is skipped, not failed.
          if curl -sfo /dev/null \
               "https://repo1.maven.org/maven2/org/dizitart/cryptand/$version/cryptand-$version.pom"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "cryptand $version is already on Maven Central"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test, sign and publish
        if: steps.v.outputs.skip == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release deploy
