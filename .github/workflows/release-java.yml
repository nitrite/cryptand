name: Release Java

# Tag `java-vX.Y.Z`. Publishes org.dizitart:cryptand through the Central
# Portal, under the org.dizitart namespace nitrite-java already publishes to.
#
# Secrets: MAVEN_USERNAME / MAVEN_PASSWORD (a Central Portal user token),
# GPG_PRIVATE_KEY (ASCII-armoured) and GPG_PASSPHRASE.
#
# Push release tags three at a time at most: GitHub creates no tag events at
# all for a push carrying more than three.

on:
  push:
    tags:
      - 'java-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by SHA (tag in the trailing comment).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reference/java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Version
        id: v
        run: |
          set -euo pipefail
          version="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "java-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pom version $version"
            exit 1
          fi
          # Resumable: a version already on Central is skipped, not failed.
          if curl -sfo /dev/null \
               "https://repo1.maven.org/maven2/org/dizitart/cryptand/$version/cryptand-$version.pom"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "cryptand $version is already on Maven Central"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test, sign and publish
        if: steps.v.outputs.skip == 'false'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release deploy
      - name: SBOM
        run: |
          mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=cryptand-java.cdx
          mv target/cryptand-java.cdx.json .
      # SBOM on the GitHub release for this tag (created if missing).
      - name: Attach SBOM
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" cryptand-java.cdx.json --clobber
