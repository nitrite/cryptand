name: Release Rust

# Tag `rust-vX.Y.Z` (or `rust-vX.Y.Z-rc.N` for a test build). Push release
# tags three at a time at most: GitHub creates no tag events at all for a push
# carrying more than three.

on:
  push:
    tags:
      - 'rust-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify, but do not upload
        type: boolean
        default: true

permissions:
  contents: read

# Actions are pinned by SHA (tag in the trailing comment).
jobs:
  publish:
    runs-on: ubuntu-latest
    # A publish that stalls on a credential should cost minutes, not the
    # six-hour default.
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: reference/rust
      - run: cargo test -p cryptand
      - name: Version
        id: v
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="cryptand") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "rust-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          # Resumable: a version already on the registry is skipped, not failed.
          if curl -sfo /dev/null -H 'User-Agent: cryptand-release' \
               "https://crates.io/api/v1/crates/cryptand/$version"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "cryptand $version is already on crates.io"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry run
        if: github.event.inputs.dry_run == 'true'
        run: cargo publish -p cryptand --dry-run
      - name: Publish
        if: github.event.inputs.dry_run != 'true' && steps.v.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cryptand
      - name: SBOM
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx -f json --spec-version 1.5
          mv cryptand/cryptand.cdx.json cryptand-rust.cdx.json
      # SBOM on the GitHub release for this tag (created if missing).
      - name: Attach SBOM
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" cryptand-rust.cdx.json --clobber
