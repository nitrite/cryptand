name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (debug and release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reference/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference/rust
      # Both profiles: they test different arithmetic. An overflow that
      # panics in debug silently wraps in release.
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # `verify`, not `test`: the coverage ratchet and the javadoc jar a
      # release needs both run here, so a tag never finds them broken.
      - run: mvn -B verify

  dart:
    name: Dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reference/dart/cryptand
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  interop:
    name: Cross-language round trip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference/rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: dart-lang/setup-dart@v1
      # run.sh builds Java offline, so the dependencies are fetched first.
      - run: mvn -B -q -DskipTests test-compile
        working-directory: reference/java
      - run: dart pub get
        working-directory: reference/dart/cryptand
      - run: reference/conformance/interop/run.sh
